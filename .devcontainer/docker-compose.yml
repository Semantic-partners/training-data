services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/training-data:cached
    command: sleep infinity
    networks:
      - kgnet

  # Apache Jena Fuseki — free, no licence (unlike GraphDB 11, which now requires
  # one even for its free tier). A mounted config serves two services over one
  # store: /training (plain) and /training-inferred (OWLMicro reasoner).
  fuseki:
    image: stain/jena-fuseki:latest
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - FUSEKI_BASE=/fuseki
    volumes:
      - ./fuseki/config.ttl:/fuseki/config.ttl:ro
      - ./fuseki/shiro.ini:/fuseki/shiro.ini:ro
    networks:
      - kgnet

networks:
  kgnet:
